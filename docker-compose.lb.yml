# 3 API replicas behind an nginx load balancer, using MongoDB Atlas
# Usage:  docker compose -f docker-compose.lb.yml up --build -d      ->  app http://localhost:8090, LB http://localhost:8081
# Single-instance benchmark:  NGINX_CONF=./nginx/lb-single.conf docker compose -f docker-compose.lb.yml up -d --no-deps api1 lb
x-api: &api
  build: ./server
  image: ceh-server:da3
  restart: unless-stopped
  env_file:
    - ./server/.env
  cpus: 0.1                    # Render free instance size
  mem_limit: 512m
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  api1:
    <<: *api
    environment:
      INSTANCE_NAME: api1
      MONGO_DB_NAME: ${MONGO_DB_NAME:-college_events_hub_da3}
      PORT: 5000
    ports:
      - "5001:5000"

  api2:
    <<: *api
    environment:
      INSTANCE_NAME: api2
      MONGO_DB_NAME: ${MONGO_DB_NAME:-college_events_hub_da3}
      PORT: 5000
    ports:
      - "5002:5000"

  api3:
    <<: *api
    environment:
      INSTANCE_NAME: api3
      MONGO_DB_NAME: ${MONGO_DB_NAME:-college_events_hub_da3}
      PORT: 5000
    ports:
      - "5003:5000"

  lb:
    image: nginx:1.29-alpine
    container_name: ceh-lb
    restart: unless-stopped
    volumes:
      - ${NGINX_CONF:-./nginx/lb.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api1, api2, api3]
    ports:
      - "8081:80"

  client:
    build: ./client
    restart: unless-stopped
    volumes:
      - ./nginx/client.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [lb]
    ports:
      - "8090:80"
