# Render Blueprint – Infrastructure as Code for College-Events-hub.
# Render → New → Blueprint → select this repo. It creates both services below.
# Deploys are triggered by GitHub Actions (deploy hooks) only after CI passes.

services:
  # ---------- REST API (Docker) ----------
  - type: web
    name: college-events-hub-api2
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false            # MongoDB Atlas connection string (asked on creation)
      - key: JWT_SECRET
        generateValue: true    # random 256-bit secret generated by Render
      - key: CLIENT_URL
        value: https://college-events-hub.onrender.com   # frontend URL allowed by CORS
      - key: BREVO_API_KEY
        sync: false            # Brevo API key for OTP emails
      - key: MAIL_FROM
        sync: false            # sender email verified in Brevo

  # ---------- React frontend (static site on Render's CDN) ----------
  - type: web
    name: college-events-hub
    runtime: static
    branch: main
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://college-events-hub-api2.onrender.com/api   # API URL baked in at build time
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
