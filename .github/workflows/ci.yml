name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Seed database
        run: npm run seed
        env:
          MONGO_URI: mongodb://localhost:27017/college_events_hub
      - name: API smoke test
        env:
          MONGO_URI: mongodb://localhost:27017/college_events_hub
          JWT_SECRET: ci-secret
        run: |
          node server.js &
          for i in $(seq 1 20); do curl -fs http://localhost:5000/api/health && break; sleep 1; done
          curl -fs http://localhost:5000/api/health | grep '"db":"connected"'
          curl -fs http://localhost:5000/api/events | grep -q '"title"'
          curl -fs http://localhost:5000/api/events/filters | grep -q '"clubs"'
          TOKEN=$(curl -fs -X POST http://localhost:5000/api/auth/signin -H 'Content-Type: application/json' \
            -d '{"email":"admin@college.edu","password":"password123"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')
          curl -fs http://localhost:5000/api/registrations/stats -H "Authorization: Bearer $TOKEN" | grep -q '"totalEvents"'
          echo "Smoke test passed"

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t college-events-hub-server ./server
      - run: docker build -t college-events-hub-client ./client
