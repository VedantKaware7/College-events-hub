name: Seed production database

# Manual workflow: wipes and re-seeds MongoDB Atlas with demo data.
# Render's free tier has no shell access, so seeding runs from GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type SEED to wipe and re-seed the production database"
        required: true

jobs:
  seed:
    if: ${{ inputs.confirm == 'SEED' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Seed MongoDB Atlas
        run: npm run seed
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
