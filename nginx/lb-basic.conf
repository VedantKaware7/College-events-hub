# Plain round-robin, no retry ("before" config for the failover test).
upstream ceh_api {
    server api1:5000;
    server api2:5000;
    server api3:5000;
}

log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr '
                    'instance=$upstream_http_x_instance rt=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    location /api/ {
        proxy_pass http://ceh_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream off;
    }
}
