# Round-robin with failover: failed requests are retried on another replica.
upstream ceh_api {
    zone ceh_api 64k;            # shared state across nginx workers
    server api1:5000 max_fails=1 fail_timeout=10s;
    server api2:5000 max_fails=1 fail_timeout=10s;
    server api3:5000 max_fails=1 fail_timeout=10s;
    keepalive 32;
}

log_format upstream '$remote_addr "$request" $status upstream=$upstream_addr '
                    'instance=$upstream_http_x_instance rt=$request_time';

server {
    listen 80;
    access_log /var/log/nginx/access.log upstream;

    location /api/ {
        proxy_pass http://ceh_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }
}
