# Local development / demo stack: MongoDB + API + nginx-served React app
# Usage: docker compose up --build   ->  http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - path: ./server/.env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017/college_events_hub
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me}
      PORT: 5000
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  mongo_data:
